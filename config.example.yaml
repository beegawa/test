# ============================================================================
# webrec 설정 예시
#   - 최소한 url / 시간(start 또는 cron) / duration 만 적으면 됩니다.
#   - 나머지는 defaults 값이 자동으로 적용됩니다.
#   - ${VAR} 는 환경변수로 치환됩니다. (비밀번호는 반드시 환경변수로!)
# ============================================================================

log_dir: logs            # 실행 로그 저장 폴더
state_dir: .state        # 마지막 실행 기록(재시작 시 중복 실행 방지)

# ------------------------------------------------------- 메일(SMTP) 설정
smtp:
  host: ${SMTP_HOST:-smtp.gmail.com}
  port: 587
  username: ${SMTP_USER}
  password: ${SMTP_PASS}      # Gmail 은 '앱 비밀번호' 사용
  from: ${SMTP_FROM}          # 비우면 username 을 발신자로 사용
  starttls: true

# ------------------------------------------------------- 모든 작업 공통값
defaults:
  output_dir: recordings
  backend: auto            # auto | stream(yt-dlp+ffmpeg) | browser(화면 캡처)
  timezone: Asia/Seoul
  max_retries: 3           # 녹화 중 끊기면 남은 시간만큼 재시도
  stall_timeout: 90        # 이 시간(초) 동안 파일이 안 커지면 끊긴 것으로 판단
  remux_mp4: false         # true 면 녹화 후 mp4 로 변환

  preflight:               # ★ 시작 전 샘플링 점검
    enabled: true
    duration: 10           # 10초 샘플 녹화
    lead_seconds: 300      # 시작 5분 전에 점검
    abort_on_failure: false  # true 면 점검 실패 시 본 녹화를 취소
    keep_sample: false     # true 면 샘플 파일을 남김
    require_audio: false   # true 면 소리가 없을 때 실패 처리

  video:
    resolution: 1280x720
    fps: 30
    audio: true
    container: mkv         # mkv 는 중간에 죽어도 파일이 살아남습니다

  notify:
    to: travislee@shinwon.com
    on: [preflight_failed, started, completed, failed]
    attach_log: true

# ------------------------------------------------------- 실제 녹화 작업들
jobs:
  # 1) YouTube 라이브를 한 번만, 지정한 시각에
  - name: youtube-live
    url: https://www.youtube.com/watch?v=CHANGE_ME
    start: "2026-09-20 21:00"
    duration: 1h30m

  # 2) 매주 월/수 09:00 Zoom 정기회의
  - name: weekly-zoom
    url: https://zoom.us/j/1234567890?pwd=CHANGE_ME
    cron: "0 9 * * mon,wed"
    duration: 1h
    backend: browser
    browser:
      display_name: "회의 녹화"
      passcode: ${ZOOM_PASSCODE}
      page_load_wait: 25

  # 3) 평일 매일 08:50, 점검 실패하면 아예 녹화하지 않음
  - name: daily-briefing
    url: https://www.youtube.com/@example/live
    cron: "50 8 * * 1-5"
    duration: 40m
    remux_mp4: true
    preflight:
      lead_seconds: 600
      abort_on_failure: true
    notify:
      on: [preflight_failed, completed, failed]
